name: Keep the database awake

# Supabase pauses a free project after a week with no activity. A tiny call
# every three days keeps it awake; it uses the public (publishable) key that
# ships inside the apps. The game and Posture Analyzer share this project, and
# both repositories run this, so one can fail without the server pausing.
#
# GitHub turns off scheduled workflows in a repository with no commits for 60
# days, so each run also re-enables this workflow, which resets that clock.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive
        run: |
          URL=https://lnbhmstwdonkowpvcczy.supabase.co
          KEY=sb_publishable_GVe_BwcPk02FVbDjfcN75Q_XLvO_7K1
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keep_alive" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "HTTP $code: $(cat out.txt)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "::error::The database did not answer. It may be paused: restore it from the Supabase dashboard."
          exit 1

      - name: Stay scheduled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-alive.yml/enable" && echo "re-enabled"
