name: Keep the race server awake

# Supabase pauses a free project after a week with no activity. A tiny call
# every three days keeps it awake. It uses the app's public (publishable)
# key, the same one shipped inside the APK.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive
        run: |
          URL=https://lnbhmstwdonkowpvcczy.supabase.co
          KEY=sb_publishable_GVe_BwcPk02FVbDjfcN75Q_XLvO_7K1
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keep_alive" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "HTTP $code: $(cat out.txt)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "::error::The server did not answer. It may be paused: restore it from the Supabase dashboard."
          exit 1
