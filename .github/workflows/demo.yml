name: Video demo APK

# Run by hand (Actions → Video demo APK → Run workflow). Builds a separate
# app, "PUAB Demo", whose races are against a bot with reps counted without a
# camera, for filming. It installs next to the real game and never talks to
# the race server. The APK is kept as this run's artifact (90 days, the most GitHub allows), not published.
on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Make it a separate app
        run: |
          sed -i 's/applicationId = "com.repraid.app"/applicationId = "com.repraid.app.demo"/' android/app/build.gradle
          sed -i 's/android:label="Push Up Adventure Battle"/android:label="PUAB Demo"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:scheme="com.repraid.app"/android:scheme="com.repraid.app.demo"/' android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId' android/app/build.gradle
          grep -n 'label=\|scheme=' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=DEMO=true --target-platform android-arm64 2>&1 | tee build.log || {
            msg=$(grep -E -A12 "What went wrong|error:|Error:|^e: " build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=APK build failed::${msg:-$(tail -40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
            exit 1
          }
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/PushUpAdventureBattle-Demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PushUpAdventureBattle-Demo
          path: out/PushUpAdventureBattle-Demo.apk
          retention-days: 90
