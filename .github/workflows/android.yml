name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Release key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=release
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            # Put the reason where the run summary shows it.
            msg=$(grep -E -A12 "What went wrong|error:|Error:|^e: " build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=APK build failed::${msg:-$(tail -40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
            exit 1
          }

      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/PushUpAdventureBattle-$VERSION.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30
